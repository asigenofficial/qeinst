# ==============================================================================
# Nginx Configuration for qeinst.com (Frontend + Laravel API Backend)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name qeinst.com www.qeinst.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qeinst.com www.qeinst.com;

    root /var/www/qeinst.com;
    index index.html index.php;

    # SSL Certificate (Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/qeinst.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/qeinst.com/privkey.pem;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Charset
    charset utf-8;

    # Static Assets & Caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Route /api/ to Laravel Backend index.php
    location /api {
        try_files $uri $uri/ /backend/public/index.php?$query_string;
    }

    # PHP FastCGI for Laravel Backend
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # Adjust PHP version if needed
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Frontend Static Routing
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Deny access to sensitive files
    location ~ /\.(env|git|sqlite) {
        deny all;
        return 404;
    }

    location ~ /(package\.json|composer\.(json|lock)|tools) {
        deny all;
        return 404;
    }
}
